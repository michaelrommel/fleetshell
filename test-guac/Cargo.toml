[package]
name        = "test-guac"
version     = "0.1.0"
edition     = "2021"
description = "Smoke-test tool: connect to guacd and drive an RDP/VNC session handshake"

[[bin]]
name = "test-guac"
path = "src/main.rs"

[dependencies]
# rustls for optional TLS in gateway mode (set GATEWAY_TLS=true when the
# gateway is not behind an NLB that terminates TLS).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
