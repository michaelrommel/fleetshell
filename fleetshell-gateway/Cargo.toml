[package]
name = "fleetshell-gateway"
version = "0.1.0"
edition = "2021"
description = "FleetShell tunnel gateway — TLS TCP proxy with JWT authentication"

[[bin]]
name = "fleetshell-gateway"
path = "src/main.rs"

[dependencies]
# ── Async runtime ────────────────────────────────────────────────────────────
tokio         = { version = "1",    features = ["full"] }

# ── TLS server ───────────────────────────────────────────────────────────────
# Both tokio-rustls and rustls default to aws_lc_rs; adding ring on top
# gives two providers → runtime panic.  Opt out of defaults, pick ring only.
tokio-rustls  = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls        = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

# ── Self-signed certificate generation ──────────────────────────────────────
rcgen         = "0.14"

# ── JWT authentication ───────────────────────────────────────────────────────
# jwt requires an explicit crypto backend; rust_crypto (pure-Rust hmac/sha2)
# is consistent with our ring-only policy and avoids aws-lc-rs.
jsonwebtoken  = { version = "10", features = ["rust_crypto"] }

# ── HTTP/1.x header parsing (transform mode) ────────────────────────────────
httparse      = "1"

# ── Serialisation ────────────────────────────────────────────────────────────
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"

# ── Logging / tracing ────────────────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }

# ── SSH client (direct SSH handler, bypasses guacd) ────────────────────────
# russh is a pure-Rust async SSH implementation.  No separate russh-keys
# needed in 0.62 — key types come from the ssh-key crate re-exported by russh.
# The "ring" feature forces the ring crypto backend, consistent with the rest
# of this gateway (avoids pulling in aws-lc-rs).
russh       = { version = "0.62", default-features = false, features = ["ring"] }

# ── Error handling ───────────────────────────────────────────────────────────
thiserror   = "1"

# ── Session recording post-processor (guacrecord binary) ─────────────────────
# inotify gives a single kernel-level watch on the jobs directory; guacrecord
# holds only one inotify handle regardless of how many devices are recorded.
inotify     = "0.10"

# OpenDAL: S3 upload after recording processing.  Same version / features as
# aeroftp.  Credentials auto-discovered from ECS task role via
# AWS_CONTAINER_CREDENTIALS_RELATIVE_URI — no explicit config needed.
opendal = { version = "0.56.0", default-features = false, features = [
    "services-s3", "executors-tokio", "layers-retry", "reqwest-rustls-tls",
] }

# ZIP archive (one bundle per session uploaded alongside the other files).
zip    = "2"

# Date formatting for S3 key prefix  guacamole/recordings/<ip>/YYYY-MM-DD/.
chrono = "0.4"

# Error-handling ergonomics for guacrecord (not used in gateway binary).
anyhow = "1"

# bytes is a transitive dep via opendal; declared explicitly for guacrecord.
bytes  = "1"
